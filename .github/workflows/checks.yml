name: Application checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CAMPAIGN_STUDIO_DATA_DIR: .checks/runtime
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install from the lock
        run: uv sync --locked
      - name: Style
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: JavaScript controller tests
        run: |
          mkdir -p .checks
          node --version
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=.checks/javascript.xml tests/*.test.cjs
      - name: Diagnose cold CLI startup
        run: uv run --locked pytest -vv -s --tb=short tests/test_cli.py::test_real_server_starts_on_loopback_and_shuts_down --junitxml=.checks/startup.xml
      - name: Python behavioral tests
        run: uv run --locked pytest --junitxml=.checks/pytest.xml
      - name: Verify the installation dependency export
        run: |
          uv export --locked --no-dev --group build --no-emit-project --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Conventional installation and synthetic sample
        run: |
          python -m venv .venv-evaluator
          .venv-evaluator/bin/python -m pip install --require-hashes -r requirements.txt
          .venv-evaluator/bin/python -m pip install --no-deps --no-build-isolation .
          .venv-evaluator/bin/python -m pip check
          .venv-evaluator/bin/campaign-studio smoke > .checks/smoke.json
          .venv-evaluator/bin/campaign-studio sample-run > .checks/sample-run.json
          .venv-evaluator/bin/campaign-studio sample-run --products 3 --us-only > .checks/alternate-sample.json
          .venv-evaluator/bin/campaign-studio sample-run --replay > .checks/replay-sample.json
      - name: Write measured results
        if: always()
        run: python scripts/ci_summary.py
      - name: Preserve check reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-reports
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .checks/startup.xml
            .checks/pytest.xml
            .checks/javascript.xml
            .checks/smoke.json
            .checks/sample-run.json
            .checks/alternate-sample.json
            .checks/replay-sample.json

  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install from the lock
        run: uv sync --locked
      - name: Python behavioral tests on Windows
        run: uv run --locked pytest --junitxml=.checks/windows-pytest.xml
      - name: Check installed smoke command
        run: .\.venv\Scripts\campaign-studio.exe smoke --data-dir .checks/smoke
      - name: Check installed synthetic images and export
        run: .\.venv\Scripts\campaign-studio.exe sample-run --data-dir .checks/sample
      - name: Install and start the packaged ZIP on Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .checks | Out-Null
          uv run --locked python scripts/package_source.py .checks/motif-campaign-studio.zip
          if ($LASTEXITCODE -ne 0) { throw 'Source ZIP packaging failed.' }
          Expand-Archive .checks/motif-campaign-studio.zip '.checks/ZIP install'
          $install = (Resolve-Path '.checks/ZIP install/Motif').Path
          Push-Location $install
          try {
            uv sync --locked
            if ($LASTEXITCODE -ne 0) { throw 'Packaged uv installation failed.' }
            uv run --locked campaign-studio smoke
            if ($LASTEXITCODE -ne 0) { throw 'Packaged smoke check failed.' }
            $env:CAMPAIGN_STUDIO_PORT = '8338'
            $server = Start-Process uv -ArgumentList 'run','--locked','campaign-studio','serve' -WorkingDirectory $install -PassThru -RedirectStandardOutput server.stdout.txt -RedirectStandardError server.stderr.txt
            try {
              $ready = $false
              for ($attempt = 0; $attempt -lt 120; $attempt++) {
                if ($server.HasExited) { throw 'Packaged server exited before becoming ready.' }
                try {
                  $health = Invoke-WebRequest 'http://127.0.0.1:8338/health' -TimeoutSec 2
                  $home = Invoke-WebRequest 'http://127.0.0.1:8338/' -TimeoutSec 2
                  if ($health.StatusCode -eq 200 -and $home.StatusCode -eq 200 -and $home.Content -match 'Motif') { $ready = $true; break }
                } catch { Start-Sleep -Milliseconds 500 }
              }
              if (-not $ready) { throw 'Packaged server did not serve Workbench and health.' }
            } finally {
              taskkill /PID $server.Id /T /F | Out-Null
              Remove-Item Env:CAMPAIGN_STUDIO_PORT
            }
          } finally { Pop-Location }
      - name: Preserve Windows check reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-check-reports
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .checks/windows-pytest.xml
            .checks/ZIP install/Motif/server.stdout.txt
            .checks/ZIP install/Motif/server.stderr.txt
